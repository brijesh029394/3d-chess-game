<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:;">
    <title>Animal Kingdom 3D Chess 🦁</title>
    <style>
        :root {
            --bg: #1e1e24;
            --surface: rgba(20,20,26,0.85);
            --text: #f5f5f7;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #4ade80;
            --danger: #f43f5e;
            --warning: #f6d365;
            --radius: 8px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; overflow: hidden;
            background: var(--bg);
            font: 400 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: var(--text); user-select: none;
        }
        #hud {
            position: absolute; top: 12px; left: 12px;
            background: var(--surface); backdrop-filter: blur(8px);
            padding: 12px 16px; border-radius: var(--radius);
            min-width: 180px;
        }
        #hud h1 { margin: 0 0 6px; font: 600 18px/1.2 inherit; }
        #status { font-weight: 600; color: var(--success); }
        #status.thinking { color: var(--accent); }
        #status.check { color: var(--warning); }
        #animal-guide-trigger { margin-top: 8px; width: 100%; }
        :focus-visible { outline: 3px solid #f6d365; outline-offset: 3px; }
        canvas:focus-visible { outline: 4px solid #f6d365; outline-offset: -5px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        #animal-guide {
            position: fixed; z-index: 8; right: 12px; top: 12px;
            width: min(320px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
            overflow: auto; padding: 16px; border-radius: 12px;
            background: rgba(20,20,26,0.96); box-shadow: 0 12px 36px rgba(0,0,0,.45);
        }
        #animal-guide[hidden] { display: none; }
        .guide-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .guide-head h2 { margin: 0; font-size: 18px; }
        #animal-guide-close { padding: 6px; min-height: 44px; }
        .animal-list { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 8px; }
        .animal-list li { display: grid; grid-template-columns: 28px 1fr 1fr; gap: 8px; align-items: center; }
        .piece-symbol { font-weight: 800; color: #f6d365; }
        .team-key { border-top: 1px solid rgba(255,255,255,.2); padding-top: 10px; }
        .team-dot { display: inline-block; width: 14px; height: 14px; border: 3px solid; border-radius: 50%; vertical-align: -2px; margin-right: 4px; }
        .team-dot.dawn { border-color: #35d9ff; background: #f5ead4; }
        .team-dot.dusk { border-color: #ad73ff; background: #252b38; }

        #controls {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 10px; flex-wrap: wrap;
            justify-content: center;
            background: var(--surface); backdrop-filter: blur(8px);
            padding: 10px 14px; border-radius: var(--radius);
            max-width: calc(100vw - 24px);
        }
        button, select {
            font: inherit; color: var(--text);
            background: var(--accent); border: none;
            padding: 10px 16px; min-height: 44px; min-width: 44px;
            border-radius: 6px; cursor: pointer;
            transition: background 120ms ease-out;
        }
        button:hover:not(:disabled) { background: var(--accent-hover); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.2); }
        select {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }

        #history-panel {
            position: absolute; right: 12px; top: 12px; bottom: 90px;
            width: 220px;
            background: var(--surface); backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 12px;
            overflow-y: auto;
            transition: transform 220ms ease-out;
        }
        #history-panel.hidden { transform: translateX(240px); }
        #history-panel h3 { margin: 0 0 8px; font: 600 14px/1.2 inherit; }
        #history-list {
            font: 500 13px/1.6 ui-monospace, 'SF Mono', monospace;
            display: grid; grid-template-columns: 24px 1fr 1fr; gap: 2px 8px;
        }
        #history-list .num { color: rgba(255,255,255,0.4); }
        #history-list .move.last { background: rgba(246,211,101,0.15); border-radius: 3px; padding: 0 4px; }

        #toggle-history {
            position: absolute; right: 12px; bottom: 20px;
            padding: 8px 12px; font-size: 12px;
        }

        #overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 10;
        }
        #overlay.show { display: flex; }
        #overlay .card {
            background: var(--surface); backdrop-filter: blur(12px);
            padding: 24px; border-radius: 12px;
            text-align: center; max-width: 320px;
        }
        #overlay h2 { margin: 0 0 8px; }
        #overlay p { margin: 0 0 16px; opacity: 0.85; }
        #overlay .actions { display: flex; gap: 10px; justify-content: center; }

        @media (max-width: 640px) {
            #history-panel { display: none; }
            #toggle-history { display: none; }
            #hud { padding: 8px 12px; min-width: 140px; }
            #animal-guide { top: auto; bottom: 0; right: 0; width: 100%; max-height: 60vh; border-radius: 14px 14px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <div id="hud">
        <h1>🦁 Animal Kingdom Chess</h1>
        <div>Turn: <span id="status" role="status" aria-live="polite">Dawn's Turn</span></div>
        <button id="animal-guide-trigger" class="ghost" aria-expanded="false" aria-controls="animal-guide">Animal Guide</button>
    </div>
    <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <section id="animal-guide" aria-labelledby="animal-guide-title" hidden>
        <div class="guide-head"><h2 id="animal-guide-title">Animal Guide</h2><button id="animal-guide-close" class="ghost" aria-label="Close Animal Guide">✕</button></div>
        <ul class="animal-list">
            <li><span class="piece-symbol">P</span><strong>Rabbit</strong><span>Pawn</span></li>
            <li><span class="piece-symbol">R</span><strong>Elephant</strong><span>Rook</span></li>
            <li><span class="piece-symbol">N</span><strong>Horse</strong><span>Knight</span></li>
            <li><span class="piece-symbol">B</span><strong>Dog</strong><span>Bishop</span></li>
            <li><span class="piece-symbol">Q</span><strong>Peacock</strong><span>Queen</span></li>
            <li><span class="piece-symbol">K</span><strong>Lion</strong><span>King</span></li>
        </ul>
        <div class="team-key"><span class="team-dot dawn"></span>Dawn — cyan base marker<br><span class="team-dot dusk"></span>Dusk — violet base marker</div>
    </section>

    <div id="history-panel">
        <h3>Move History</h3>
        <div id="history-list"></div>
    </div>
    <button id="toggle-history" class="ghost">Hide History</button>

    <div id="controls">
        <select id="mode-select" aria-label="Game mode">
            <option value="hvh">👥 Human vs Human</option>
            <option value="hvai">🤖 vs Computer</option>
        </select>
        <select id="difficulty-select" aria-label="AI difficulty" style="display:none">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
        </select>
        <button id="undo-btn" disabled aria-label="Undo last move">↶ Undo</button>
        <button id="reset-btn" aria-label="New game">🔄 New Game</button>
    </div>

    <div id="overlay" role="dialog" aria-modal="true">
        <div class="card">
            <h2 id="overlay-title">Game Over</h2>
            <p id="overlay-msg"></p>
            <div class="actions">
                <button id="overlay-new">New Game</button>
                <button id="overlay-close" class="ghost">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
